name: Android CI/CD Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 with built-in Gradle Caching
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Setup Android SDK Environment & Accept Licenses (Native - No Node.js wrappers)
      - name: Configure Android SDK & Licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      # 4. Prepare Environment, Keystore, and local.properties
      - name: Prepare build environment
        run: |
          ANDROID_DIR=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "sdk.dir=$ANDROID_DIR" > local.properties

          echo "Setting up debug.keystore..."
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Setting up .env file..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      # 5. Install Gradle 8.11.1 (Native - zero Node.js deprecations)
      - name: Setup Gradle CLI
        run: |
          if ! command -v gradle &> /dev/null; then
            echo "Installing Gradle 8.11.1..."
            wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            sudo unzip -q -d /opt gradle-8.11.1-bin.zip
            sudo ln -sf /opt/gradle-8.11.1/bin/gradle /usr/local/bin/gradle
            rm -f gradle-8.11.1-bin.zip
          fi
          gradle --version

      # 6. Build Debug APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-configuration-cache --no-daemon --stacktrace

      # 7. Run Unit Tests (Non-blocking)
      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest --no-configuration-cache --no-daemon --continue || true
        continue-on-error: true

      # 8. Upload Debug APK Artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumina-AI-Studio-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: warn

      # 9. Upload Unit Test Reports (if available)
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore
