name: Android CI/CD Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Android SDK Tools & Accept Licenses
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Prepare environment & keystores
      - name: Prepare build environment
        run: |
          echo "Setting up keystore..."
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Setting up .env file..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      # 5. Set up Gradle with caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 6. Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 7. Run Unit Tests
      - name: Run Unit Tests
        run: gradle testDebugUnitTest --continue --stacktrace
        continue-on-error: true

      # 8. Upload Debug APK Artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success() || always()
        with:
          name: Lumina-AI-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      # 9. Upload Unit Test Reports
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
